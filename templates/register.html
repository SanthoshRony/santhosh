{% load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'register.css'%}">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Register</title>
</head>
<body>
        {% if messages %} 
            <div class="alert-container">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}


    <div class="container">
    <form action="register" method="post">
        {% csrf_token %}
        <div class="form-group">
            <input placeholder="First Name"  type="text" id="first-name" name="first_name" required>
        </div>

        <div class="form-group">
            
            <input placeholder="Last Name" type="text" id="last-name" name="last_name" required>
        </div>

        <div class="form-group">
            
            <input placeholder="Password" type="password" id="password" name="password1" required>
        </div>

        <div class="form-group">
            
            <input placeholder="Confirm Password" type="password" id="confirm-password" name="password2" required>
        </div>

        <div class="form-group">
            
            <input placeholder="Phone Number" type="tel" id="phone" name="phone" required>
        </div>
        <div class="btn">
          <button type="submit">Register</button>
        </div>
    </form>
</div>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
